<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
  <body>
    <button id="getData">Get Data</button>
    <button id="getList">Get List</button>
    <br></br>

    <form id="myForm">
        <input type="text" name="firstname" id="firstname" placeholder="Firstname" required />
        <input type="text" name="lastname" id="lastname" placeholder="Lastname" required />
        <button type="submit">Submit</button>
    </form>

    <p id="posts"></p>
    <p id="message"></p>
    <p id="greeting"></p>

    <script>
        document.getElementById('getData').addEventListener('click', getData);
        document.getElementById('getList').addEventListener('click', getList);
        document.getElementById('myForm').addEventListener('submit', submitForm);

        function getData(){
    
            fetch('https://mysite.itvarsity.org/api/fetch/get-data/') 
               .then(function(response){
                return response.text();

               })
               
               .then(function(data){
                document.getElementById('message').innerHTML= data;

               })

        }

        function getList(){
            fetch('https://mysite.itvarsity.org/api/fetch/get-list/')
            .then(function(response){
                return response.json();

            })

            .then(function(data){
                let output="<h1>posts</h1>"

                for(let a=0; a < data.length; a++){
                    output += `
                    <ul> 
                       <li><h2>${data[0]}</h2></li>
                       <li><b>${data[a][1]}</b></li>
                       <li>${data[a][2]}</li>
                    </ul>
                    
                    `
                }
                document.getElementById('posts').innerHTML=output;
            })
        
        }

        function submitForm(e){
            e.preventDefault();

            const form = new FormData(e.currentTarget);

            fetch('https://mysite.itvarsity.org/api/fetch/send-data/',{
                method: 'POST',
                headers:{'Accept':'application/json,*/*'},
                body:form
            })
            .then(function(response){
                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }
                return response.text();
            })
            .then(function(data){
                document.getElementById('greeting').textContent = data;
            })
            .catch(function(error) {
                console.error('Form submission failed:', error);
                document.getElementById('greeting').textContent = 'Could not submit the form. Please try again.';
            })
        
        }
    </script>
  
    
  </body>
</html>
